[project]
name = "flepimop2-transform"
version = "0.3.0dev"
description = "A cached script-transform process provider for flepimop2."
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [{ name = "Weston Voglesonger" }]
requires-python = ">=3.11,<3.15"
dependencies = ["flepimop2>=0.3.0,<1.0.0", "pydantic>=2.12.4"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[build-system]
requires = ["hatchling>=1.30.1,<1.31"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flepimop2"]

[tool.hatch.build.targets.sdist]
include = ["src/flepimop2", "LICENSE", "AUTHORS", "README.md", "pyproject.toml"]
